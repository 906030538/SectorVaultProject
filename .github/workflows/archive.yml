name: Archive & cleanup index

on:
  schedule:
    - cron: "0 3 * * *" # 每日 03:00 UTC 触发，是否执行归档由 config.json 的 archiveSchedule 决定
  workflow_dispatch: {} # 手动触发时强制执行归档

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Archive and prune index
        run: node scripts/archive.mjs${{ github.event_name == 'workflow_dispatch' && ' --force' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(index): monthly archive & repo existence cleanup"
