name: Atomgit branch gate

# 无流水线能力平台的镜像门禁：镜像集成直接推送到 atomgit 分支，
# 本工作流校验通过后自动合入 index 分支（触发 rebuild 重建 current.json）。
# 安全约束：该分支只允许改动 index/archive/YYYY-MM.json；
# 删除文件、多投稿、投稿日期篡改等一律拒绝自动合入，需人工处理。
on:
  push:
    branches: [atomgit]

permissions:
  contents: write

concurrency:
  group: atomgit-gate
  cancel-in-progress: false

jobs:
  gate-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: atomgit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Skip sync pushes already contained in index
        run: |
          if git merge-base --is-ancestor HEAD origin/index; then
            echo "HEAD already contained in index (branch sync), skip gate"
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
      - name: Restrict changes to archive files
        if: env.skip != 'true'
        run: |
          non_archive=$(git diff --name-only origin/index...HEAD | grep -v '^index/archive/[0-9]\{4\}-[0-9]\{2\}\.json$' || true)
          if [ -n "$non_archive" ]; then
            echo "::error::atomgit 分支仅允许修改 index/archive/YYYY-MM.json，其余改动请走人工 PR"
            echo "$non_archive"
            exit 1
          fi
      - name: Validate archive JSON against schemas
        if: env.skip != 'true'
        run: |
          if ls index/archive/*.json >/dev/null 2>&1; then
            npx --yes ajv-cli validate \
              -s schema/archive.schema.json \
              -r schema/submission.schema.json \
              -r schema/user.schema.json \
              -d "index/archive/*.json" --spec=draft7
          fi
      - name: Check submission date immutability
        if: env.skip != 'true'
        run: |
          git worktree add ../index-wt origin/index
          node scripts/check-submitted-at.mjs ../index-wt/index/archive index/archive
      - name: Check scope
        if: env.skip != 'true'
        run: |
          out=$(node scripts/check-pr-scope.mjs ../index-wt/index/archive index/archive origin/index HEAD)
          echo "$out"
          decision=$(echo "$out" | sed -n 's/^decision=//p')
          if [ "$decision" != "auto" ]; then
            echo "::error::删除文件或一次修改多个投稿，不能自动合入；请拆分为单投稿提交或走人工 PR"
            exit 1
          fi
      - name: Check blacklist
        if: env.skip != 'true'
        run: node scripts/check-blacklist.mjs origin/index HEAD
      - name: Fetch sensitive-word pack
        # 私仓 906030538/dict-resources，需 SVP_BOT_TOKEN 具备该仓读权限；
        # 拉取失败不阻塞门禁（fail-open），扫描步骤自行跳过并告警
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.SVP_BOT_TOKEN || github.token }}
        run: |
          rm -f /tmp/dict-pack.bin
          if gh api --header "Accept: application/vnd.github.raw" \
              repos/906030538/dict-resources/contents/data/dict-pack.bin > /tmp/dict-pack.bin 2>/dev/null; then
            echo "dict pack fetched: $(wc -c < /tmp/dict-pack.bin) bytes"
          else
            echo "::warning::dict-resources 词包拉取失败，敏感扫描将跳过（fail-open）"
          fi
      - name: Scan changed submissions for sensitive content
        if: env.skip != 'true'
        id: scan
        run: node scripts/check-sensitive.mjs ../index-wt/index/archive index/archive --pack /tmp/dict-pack.bin
      - name: Reject sensitive content
        if: env.skip != 'true' && steps.scan.outputs.scan == 'blocked'
        run: |
          echo "::error::检测到敏感内容，已拒绝自动合入（评分 ${{ steps.scan.outputs.score }} ≥ 阈值 ${{ steps.scan.outputs.threshold }}；分类得分：${{ steps.scan.outputs.detail }}）"
          exit 1
      - name: Merge atomgit into index
        if: env.skip != 'true'
        run: |
          gh api -X POST "repos/${{ github.repository }}/merges" \
            -f base=index \
            -f head=atomgit \
            -f commit_message="mirror(atomgit): merge gate-passed submission"
        env:
          GH_TOKEN: ${{ github.token }}
