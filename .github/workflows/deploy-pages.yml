# 发布到 GitHub Pages（main 分支）
# 首次使用：仓库 Settings → Pages → Source 选择 "GitHub Actions"。
# 自定义域名时，把下面的 ASTRO_SITE 改为域名并将 ASTRO_BASE 置空。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # 项目页部署在 <user>.github.io/<repo> 子路径下
          ASTRO_SITE: https://svp.lyoko.cn
          # ASTRO_SITE: https://${{ github.repository_owner }}.github.io
          # ASTRO_BASE: /${{ github.event.repository.name }}
        run: npx astro build

      - name: Check
        run: npx astro check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
