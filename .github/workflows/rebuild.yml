name: Rebuild current index

on:
  push:
    branches: [index]
    paths:
      - "index/archive/**"
      - "config.json"
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync index from content repo archives
        run: node scripts/sync-from-archives.mjs
      - name: Validate archives after sync
        run: |
          if ls index/archive/*.json >/dev/null 2>&1; then
            npx --yes ajv-cli validate \
              -s schema/archive.schema.json \
              -r schema/submission.schema.json \
              -r schema/user.schema.json \
              -d "index/archive/*.json" --spec=draft7
          fi
      - name: Rebuild current.json from archives
        run: node scripts/rebuild.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Generate atom feed
        run: node scripts/generate-atom.mjs
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(index): rebuild current index and atom feed"
          file_pattern: index/current.json index/archive/** index/atom.xml
      - name: Push rebuilt index to AtomGit mirror (atomgit branch)
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          git remote add atomgit "https://CLCNTanya:${ATOMGIT_TOKEN}@atomgit.com/CLCNTanya/SectorVaultProject.git"
          git fetch atomgit
          git fetch origin index --depth 10
          git push atomgit index:atomgit
