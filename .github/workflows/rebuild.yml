name: Rebuild index and deploy

on:
  push:
    branches: [index]
    paths:
      - "index/archive/**"
      - "config.json"
  schedule:
    - cron: "0 0 1 * *" # 每月 1 日 12:00 UTC 做仓库存活清理并重建
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_PATH: "."

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: index
          path: index
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild current.json from archives
        run: node scripts/rebuild.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: ${{ env.BUILD_PATH }}/index
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(index): rebuild current index from archives"
          file_pattern: index/current.json index/archive/**

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          path: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ env.BUILD_PATH }}/main/package-lock.json
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Astro
        run: |
          npx astro build \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"
        working-directory: ${{ env.BUILD_PATH }}/main
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_PATH }}/main/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: rebuild
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
