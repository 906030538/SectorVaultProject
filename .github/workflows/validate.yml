name: Validate index PR

on:
  pull_request:
    branches: [index]
    paths:
      - "index/**"
      - "config.json"

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reject manual edits to derived current.json
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- index/current.json)
          if [ -n "$changed" ]; then
            echo "::error::index/current.json 是由 Action 生成的派生数据，请修改 index/archive/ 下的归档索引"
            exit 1
          fi
      - name: Check submission date immutability
        run: |
          git worktree add ../base origin/${{ github.base_ref }}
          node scripts/check-submitted-at.mjs ../base/index/archive index/archive
      - name: Validate archive JSON against schemas
        run: |
          if ls index/archive/*.json >/dev/null 2>&1; then
            npx --yes ajv-cli validate \
              -s schema/archive.schema.json \
              -r schema/submission.schema.json \
              -r schema/user.schema.json \
              -d "index/archive/*.json" --spec=draft7
          else
            echo "no archive files yet, skipped"
          fi
      - name: Validate config.json
        run: npx --yes ajv-cli validate -s schema/config.schema.json -d config.json --spec=draft7
      - name: Check PR scope (auto merge eligibility)
        id: scope
        run: |
          {
            node scripts/check-pr-scope.mjs \
              ../base/index/archive index/archive \
              origin/${{ github.base_ref }} HEAD
          } >> "$GITHUB_OUTPUT"
      - name: Auto merge single-submission PRs
        if: success() && steps.scope.outputs.decision == 'auto'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
      - name: Request admin review for out-of-scope PRs
        if: success() && steps.scope.outputs.decision == 'review'
        run: |
          gh pr comment "$PR_URL" --body "该 PR 删除了文件或同时修改了多个投稿（changed=${{ steps.scope.outputs.changed }}, deleted=${{ steps.scope.outputs.deleted }}），不能自动合并，需要管理员审核。"
          gh pr edit "$PR_URL" --add-reviewer "${{ github.repository_owner }}"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
