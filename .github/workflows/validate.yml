name: Validate index PR

# 使用 pull_request_target：始终执行本仓库（index 分支）最新版本的门禁，
# 而不是 fork 中可能过期的副本。
# 安全模式：只检出基线分支执行受信脚本；PR 的代码仅作为数据读入（../pr 工作树），
# 绝不执行 PR 中的任何代码或安装其依赖。
on:
  pull_request_target:
    branches: [index]
    paths:
      - "index/**"
      - "config.json"
      - "blacklist.json"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch (trusted code)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0
      - name: Fetch PR head as data-only worktree
        run: |
          git fetch origin "refs/pull/${{ github.event.pull_request.number }}/head:pr-head"
          git worktree add ../pr pr-head
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reject manual edits to derived files
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...pr-head" -- index/current.json index/atom.xml)
          if [ -n "$changed" ]; then
            echo "::error::${changed} 是由 Action 生成的派生数据，请修改 index/archive/ 下的归档索引"
            exit 1
          fi
      - name: Check submission date immutability
        run: node scripts/check-submitted-at.mjs index/archive ../pr/index/archive
      - name: Validate PR archive JSON against schemas
        run: |
          if ls ../pr/index/archive/*.json >/dev/null 2>&1; then
            npx --yes ajv-cli validate \
              -s schema/archive.schema.json \
              -r schema/submission.schema.json \
              -r schema/user.schema.json \
              -d "../pr/index/archive/*.json" --spec=draft7
          else
            echo "no archive files in PR, skipped"
          fi
      - name: Validate config.json
        run: npx --yes ajv-cli validate -s schema/config.schema.json -d ../pr/config.json --spec=draft7
      - name: Validate blacklist.json and check blacklist
        run: |
          npx --yes ajv-cli validate -s schema/blacklist.schema.json -d ../pr/blacklist.json --spec=draft7 || {
            echo "::error::../pr/blacklist.json 不符合 schema（若 PR 未改动则为基础分支配置损坏）"; exit 1; }
          # 黑名单以 PR 版本为准执行：PR 若试图删改黑名单，由下方范围检查强制人工审核
          cp ../pr/blacklist.json blacklist.json
          node scripts/check-blacklist.mjs "origin/${{ github.base_ref }}" pr-head
      - name: Validate mirrors.json and check mirror consistency
        run: |
          if [ ! -f ../pr/index/mirrors.json ]; then
            echo "::error::index/mirrors.json 不允许删除"
            exit 1
          fi
          npx --yes ajv-cli validate -s schema/mirrors.schema.json -d ../pr/index/mirrors.json --spec=draft7
          if git diff --quiet "origin/${{ github.base_ref }}...pr-head" -- index/mirrors.json; then
            echo "mirrors.json unchanged, skip consistency check"
          else
            node scripts/check-mirrors.mjs index/mirrors.json ../pr/index/mirrors.json
          fi
      - name: Check PR scope (auto merge eligibility)
        id: scope
        run: |
          {
            node scripts/check-pr-scope.mjs \
              index/archive ../pr/index/archive \
              "origin/${{ github.base_ref }}" pr-head
          } >> "$GITHUB_OUTPUT"
          # 归档与镜像索引之外的文件改动（含 blacklist.json/schema/workflow）不自动合并，防绕过
          non_archive=$(git diff --name-only "origin/${{ github.base_ref }}...pr-head" \
            | grep -v -e '^index/archive/[0-9]\{4\}-[0-9]\{2\}\.json$' -e '^index/mirrors\.json$' || true)
          if [ -n "$non_archive" ]; then
            echo "改动归档以外的文件，转人工审核: $non_archive"
            echo "decision=review" >> "$GITHUB_OUTPUT"
          fi
          # PR 作者必须是同平台被改动条目的 owner（跨平台镜像条目除外）
          if ! node scripts/check-pr-owner.mjs \
              index/archive ../pr/index/archive \
              "${{ github.event.pull_request.user.login }}" github; then
            echo "PR 作者与被改动条目的 owner 不一致，转人工审核"
            echo "decision=review" >> "$GITHUB_OUTPUT"
            echo "ownerMismatch=1" >> "$GITHUB_OUTPUT"
          else
            echo "ownerMismatch=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch sensitive-word pack
        # 私仓 906030538/dict-resources，需 SVP_BOT_TOKEN 具备该仓读权限；
        # 拉取失败不阻塞门禁（fail-open），扫描步骤自行跳过并告警
        env:
          GH_TOKEN: ${{ secrets.SVP_BOT_TOKEN || github.token }}
        run: |
          rm -f /tmp/dict-pack.bin
          if gh api --header "Accept: application/vnd.github.raw" \
              repos/906030538/dict-resources/contents/data/dict-pack.bin > /tmp/dict-pack.bin 2>/dev/null; then
            echo "dict pack fetched: $(wc -c < /tmp/dict-pack.bin) bytes"
          else
            echo "::warning::dict-resources 词包拉取失败，敏感扫描将跳过（fail-open）"
          fi
      - name: Scan changed submissions for sensitive content
        id: scan
        run: node scripts/check-sensitive.mjs index/archive ../pr/index/archive --pack /tmp/dict-pack.bin
      - name: Reject sensitive content
        # 拒绝优先于人工审查路径：评论（幂等，重复推送时更新已有评论）+ 置败检查项阻止自动合并。
        # 评论与日志只含分类得分，绝不含命中词（词典内容与试探面）
        if: success() && steps.scan.outputs.scan == 'blocked'
        run: |
          body="检测到敏感内容，自行修改或联系管理员。（评分 ${SCORE} ≥ 阈值 ${THRESHOLD}；分类得分：${DETAIL}）"
          cid=$(gh pr view "$PR_URL" --json comments --jq '[.comments[] | select(.body | startswith("检测到敏感内容"))][0].id // empty' || true)
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/$cid" -f body="$body" >/dev/null
          else
            gh pr comment "$PR_URL" --body "$body"
          fi
          echo "::error::检测到敏感内容，已拒绝自动合并（评分 ${SCORE}）"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.SVP_BOT_TOKEN || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SCORE: ${{ steps.scan.outputs.score }}
          THRESHOLD: ${{ steps.scan.outputs.threshold }}
          DETAIL: ${{ steps.scan.outputs.detail }}
      - name: Auto merge single-submission PRs
        # fork 来的 PR 中内置 GITHUB_TOKEN 被降级为只读，自动合并必须用 PAT/App token
        if: success() && steps.scope.outputs.decision == 'auto' && steps.scan.outputs.scan != 'blocked'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.SVP_BOT_TOKEN || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
      - name: Request admin review for out-of-scope PRs
        if: success() && steps.scope.outputs.decision == 'review'
        run: |
          gh pr comment "$PR_URL" --body "该 PR 不能自动合并，需要管理员审核（changed=${{ steps.scope.outputs.changed }}, deleted=${{ steps.scope.outputs.deleted }}${{ steps.scope.outputs.ownerMismatch == '1' && ', PR作者与条目owner不一致' || '' }}）。"
          gh pr edit "$PR_URL" --add-reviewer "${{ github.repository_owner }}"
        env:
          GH_TOKEN: ${{ secrets.SVP_BOT_TOKEN || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
