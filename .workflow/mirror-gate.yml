version: '1.0'
name: mirror-gate
displayName: 镜像门禁：校验并同步到主索引仓

# Gitee 镜像仓门禁：index 分支收到推送后校验归档索引，
# 通过后用 GitHub token 向主索引仓（GitHub）提交 PR。
# 需要在流水线参数中配置密钥 SVP_GITHUB_TOKEN（GitHub PAT，contents:write + pulls:write）。
triggers:
  push:
    branches:
      precise:
        - index

variables:
  GITHUB_REPO: '906030538/SectorVaultProject'
  GITHUB_BASE: 'index'
  MIRROR_PLATFORM: 'gitee'
  GITHUB_TOKEN: '${SVP_GITHUB_TOKEN}'

stages:
  - stage: gate
    displayName: 校验并同步
    strategy: fast
    trigger: auto
    steps:
      - step: build@nodejs
        name: validate-and-sync
        displayName: 校验归档并同步 PR
        nodeVersion: 20
        commands:
          - sh scripts/mirror-gate.sh
