version: "1.0"
name: validate
displayName: "PR 门禁：校验归档索引"
stages:
- name: 门禁
  displayName: 门禁
  strategy: fast
  trigger: auto
  steps:
  - step: build@nodejs
    name: validate
    displayName: 校验
    nodeVersion: 24.13.0
    commands:
    - '# 设置NPM源，提升安装速度'
    - npm config set registry https://registry.npmmirror.com
    - set -e
    - WORKDIR=$(pwd)
    - ""
    - '# 校验 schema：归档 / config / 黑名单 / 镜像索引'
    - ""
    - if ls index/archive/*.json >/dev/null 2>&1; then
    - npx --yes ajv-cli validate -s schema/archive.schema.json -r schema/submission.schema.json
      -r schema/user.schema.json -d "index/archive/*.json" --spec=draft7
    - fi
    - npx --yes ajv-cli validate -s schema/config.schema.json -d config.json --spec=draft7
    - npx --yes ajv-cli validate -s schema/blacklist.schema.json -d blacklist.json --spec=draft7
    - if [ -f index/mirrors.json ]; then
    - npx --yes ajv-cli validate -s schema/mirrors.schema.json -d index/mirrors.json --spec=draft7
    - fi
    - ""
    - '# 拉取源提交（目标分支基线与 PR 源提交）'
    - ""
    - rm -rf ../HEAD/
    - mkdir ../HEAD/
    - pushd ../HEAD/
    - git init
    - git remote add origin https://${GITEE_PIPELINE_TRIGGER_USER}:${SVP_MERGE_BOT}@gitee.com/${GITEE_REPO}
    - git fetch origin ${GITEE_COMMIT}
    - git reset --hard ${GITEE_COMMIT}
    - git fetch origin ${GITEE_SOURCE_COMMIT}
    - popd
    - ""
    - '# 检查修改生成文件和是否修改多于1个文件'
    - ""
    - diff -q index/current.json ../HEAD/index/current.json
    - if [ -f index/atom.xml ]; then diff -q index/atom.xml ../HEAD/index/atom.xml; fi
    - if [[ $(diff -r -q --exclude=".git" . ../HEAD | wc -l) -gt 1 ]]; then exit 1; fi
    - ""
    - '# 归档以外的文件仅允许 mirrors.json（黑名单/配置/门禁改动请走 GitHub PR）'
    - ""
    - files=$(diff -r -q --exclude=".git" . ../HEAD | awk '{print $2}' | sed 's|^\./||')
    - echo "changed files: $files"
    - non_allowed=$(echo "$files" | grep -v -e '^index/archive/[0-9]\{4\}-[0-9]\{2\}\.json$' -e '^index/mirrors\.json$' || true)
    - if [ -n "$non_allowed" ]; then echo "不允许修改: $non_allowed"; exit 1; fi
    - ""
    - '# 检查不允许修改的字段与未来日期（不可变 + 不得晚于当前时间）'
    - ""
    - node scripts/check-submitted-at.mjs ../HEAD/index/archive index/archive
    - ""
    - '# 黑名单：PR 提交与索引条目的作者/邮箱'
    - ""
    - pushd ../HEAD/
    - node "$WORKDIR/scripts/check-blacklist.mjs" ${GITEE_COMMIT} ${GITEE_SOURCE_COMMIT}
    - popd
    - ""
    - '# 镜像索引：仅在改动时做单 key + svp-archive.json 一致性校验'
    - ""
    - if ! diff -q index/mirrors.json ../HEAD/index/mirrors.json >/dev/null 2>&1; then
    - node scripts/check-mirrors.mjs ../HEAD/index/mirrors.json index/mirrors.json
    - fi
    - ""
    - '# 校验是否是单个commit'
    - ""
    - cd ../HEAD/
    - git checkout -B ${GITEE_BRANCH}
    - if [[ ${GITEE_COMMIT} != $(git rev-parse ${GITEE_SOURCE_COMMIT}^1) ]]; then exit 1; fi
    - ""
    - '# 合入提交'
    - git merge --ff-only ${GITEE_SOURCE_COMMIT}
    - git push --set-upstream origin ${GITEE_BRANCH}
    caches:
    - "~/.npm"
    strategy:
      retry: "0"
      resource:
        cpu: "1"
        memory: "2"
triggers:
  trigger: auto
  pr:
    branches:
      prefix: []
      precise:
      - index
      include: []
    paths:
      precise: []
      include:
      - index/archive/.*
      - index/mirrors.json
notify: []
variables:
  global:
  - SVP_MERGE_BOT
